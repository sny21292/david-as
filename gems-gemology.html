<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gems & Gemology Library — Explore expert articles on gemstones, gem profiles, and industry insights from Davidas Design Concepts.">
  <title>Gems & Gemology | Davidas Design Concepts</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/bookshelf.css">
  <script src="js/includes.js"></script>
</head>
<body>
  <div id="site-nav"></div>

  <main class="bookshelf-page">

    <!-- Header -->
    <header class="library-header">
      <span class="library-header__tag">Davidas Design Concepts &middot; The Library</span>
      <h1 class="library-header__title">Gems <em>&amp;</em> Gemology</h1>
      <p class="library-header__desc">A growing collection of articles on gemstones, their history, and the craft of jewelry. Pull a volume from the shelf to read.</p>
      <div class="library-header__divider"></div>
    </header>

    <!-- Bookcase -->
    <div class="bookcase">
      <div class="case-frame">
        <div class="case-top"></div>
        <div class="shelf" id="shelf" role="list" aria-label="Article library"></div>
        <div class="shelf-board"></div>
        <div id="decorShelves" aria-hidden="true">

          <!-- Curio shelf: stacked volumes · gem under cloche · jeweler's loupe -->
          <div class="shelf shelf--decor">
            <div class="decor decor-stack">
              <svg viewBox="0 0 150 70" width="152">
                <rect x="12" y="48" width="126" height="17" rx="3" fill="#233045"/>
                <rect x="130" y="50" width="8" height="13" rx="2" fill="#e8dfc8"/>
                <rect x="12" y="54" width="126" height="2" fill="rgba(201,164,92,0.55)"/>
                <rect x="20" y="31" width="114" height="17" rx="3" fill="#4a1f1a"/>
                <rect x="126" y="33" width="8" height="13" rx="2" fill="#e8dfc8"/>
                <rect x="20" y="37" width="114" height="2" fill="rgba(201,164,92,0.55)"/>
                <rect x="16" y="14" width="106" height="17" rx="3" fill="#1f3a2a"/>
                <rect x="114" y="16" width="8" height="13" rx="2" fill="#e8dfc8"/>
                <rect x="16" y="20" width="106" height="2" fill="rgba(201,164,92,0.55)"/>
              </svg>
            </div>
            <div class="decor decor-cloche">
              <svg viewBox="0 0 120 150" width="128">
                <ellipse cx="60" cy="141" rx="46" ry="7" fill="rgba(0,0,0,0.45)"/>
                <rect x="16" y="128" width="88" height="10" rx="4" fill="#4a2f1b"/>
                <rect x="16" y="128" width="88" height="3" rx="1.5" fill="#6b4527"/>
                <g>
                  <polygon points="46,72 74,72 90,90 30,90" fill="#35e0cd"/>
                  <polygon points="46,72 74,72 60,90" fill="#17b3a2"/>
                  <polygon points="30,90 60,90 60,124" fill="#0f8d80"/>
                  <polygon points="90,90 60,90 60,124" fill="#13a191"/>
                  <polygon points="30,90 90,90 60,124" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
                  <polygon class="gem-glint" points="48,74 56,74 40,88 34,88" fill="rgba(255,255,255,0.85)"/>
                  <path class="sparkle" d="M84 66 l2.2 5 5 2.2 -5 2.2 -2.2 5 -2.2 -5 -5 -2.2 5 -2.2 z" fill="#eafffb"/>
                  <path class="sparkle sparkle--late" d="M36 100 l1.8 4 4 1.8 -4 1.8 -1.8 4 -1.8 -4 -4 -1.8 4 -1.8 z" fill="#eafffb"/>
                </g>
                <path d="M22,128 C22,66 98,66 98,128" fill="rgba(215,238,255,0.09)" stroke="rgba(255,255,255,0.4)" stroke-width="2.5"/>
                <path d="M30,116 C30,84 44,72 52,68" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="3" stroke-linecap="round"/>
                <circle cx="60" cy="79" r="4" fill="#c9a45c"/>
              </svg>
            </div>
            <div class="decor decor-loupe">
              <svg viewBox="0 0 130 62" width="122">
                <ellipse cx="65" cy="57" rx="52" ry="4" fill="rgba(0,0,0,0.4)"/>
                <rect x="60" y="27" width="62" height="13" rx="6" fill="#3f2817"/>
                <rect x="60" y="29" width="62" height="4" rx="2" fill="#6b4527"/>
                <rect x="55" y="24" width="12" height="19" rx="3" fill="#c9a45c"/>
                <circle cx="34" cy="33" r="22" fill="rgba(200,230,220,0.10)" stroke="#c9a45c" stroke-width="6"/>
                <circle cx="34" cy="33" r="15" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
                <path d="M24,24 C27,19 34,17 39,19" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
            </div>
          </div>
          <div class="shelf-board"></div>

          <!-- Bottom shelf: potted ivy · est. plaque · ring box -->
          <div class="shelf shelf--decor">
            <div class="decor decor-plant">
              <svg viewBox="0 0 160 150" width="150">
                <ellipse cx="70" cy="144" rx="42" ry="6" fill="rgba(0,0,0,0.45)"/>
                <path d="M70,96 C50,84 34,58 40,34 C58,46 68,70 70,96" fill="#2f6b34"/>
                <path d="M70,96 C72,66 82,44 102,32 C104,58 92,84 72,96" fill="#3f8a42"/>
                <path d="M70,98 C60,80 58,60 66,44 C76,58 78,80 72,98" fill="#57a85c"/>
                <path d="M96,100 C122,108 132,124 128,142" fill="none" stroke="#2f6b34" stroke-width="4" stroke-linecap="round"/>
                <ellipse cx="112" cy="107" rx="7" ry="4.5" fill="#3f8a42" transform="rotate(24 112 107)"/>
                <ellipse cx="126" cy="121" rx="7" ry="4.5" fill="#57a85c" transform="rotate(48 126 121)"/>
                <ellipse cx="130" cy="137" rx="6.5" ry="4" fill="#2f6b34" transform="rotate(78 130 137)"/>
                <rect x="34" y="92" width="72" height="13" rx="4" fill="#b96b44"/>
                <polygon points="40,105 100,105 90,146 50,146" fill="#a9603c"/>
                <polygon points="40,105 70,105 66,146 50,146" fill="rgba(0,0,0,0.14)"/>
                <ellipse cx="70" cy="97" rx="30" ry="4" fill="#2b1a10"/>
              </svg>
            </div>
            <div class="decor decor-plaque">
              <svg viewBox="0 0 160 48" width="150">
                <ellipse cx="80" cy="45" rx="66" ry="3.5" fill="rgba(0,0,0,0.4)"/>
                <rect x="6" y="4" width="148" height="36" rx="7" fill="#a9884e"/>
                <rect x="6" y="4" width="148" height="16" rx="7" fill="#caa55d"/>
                <rect x="12" y="9" width="136" height="26" rx="4" fill="none" stroke="rgba(58,44,18,0.55)" stroke-width="1.5"/>
                <text x="80" y="27" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#3a2c12">EST. JULY 8, 1995</text>
              </svg>
            </div>
            <div class="decor decor-ringbox">
              <svg viewBox="0 0 120 112" width="108">
                <ellipse cx="60" cy="107" rx="44" ry="5" fill="rgba(0,0,0,0.45)"/>
                <rect x="24" y="8" width="72" height="38" rx="9" fill="#2c1830"/>
                <rect x="30" y="14" width="60" height="26" rx="6" fill="#4a2b45"/>
                <circle cx="60" cy="62" r="15" fill="none" stroke="#d8b46a" stroke-width="5"/>
                <polygon points="60,42 68,50 60,58 52,50" fill="#eaf7ff"/>
                <polygon points="60,42 68,50 60,54 52,50" fill="#c9e6f5"/>
                <rect x="22" y="60" width="76" height="42" rx="9" fill="#3c2338"/>
                <rect x="28" y="66" width="64" height="20" rx="6" fill="#5a3653"/>
                <line x1="44" y1="76" x2="76" y2="76" stroke="#2c1830" stroke-width="3" stroke-linecap="round"/>
              </svg>
            </div>
          </div>
          <div class="shelf-board"></div>

        </div>
        <div class="case-note">Pull a volume from the shelf to begin reading</div>
      </div>
    </div>

    <!-- Reading Pane -->
    <section class="reading-pane" id="readingPane" aria-live="polite">
      <div class="pane-inner">
        <button class="close-btn" id="closeBtn" type="button">Return to shelf</button>
        <div class="pane-eyebrow" id="paneEyebrow"></div>
        <h2 id="paneTitle"></h2>
        <div class="pane-author" id="paneAuthor"></div>
        <div id="paneBody"></div>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <script src="js/main.js"></script>
  <script src="js/bookshelf.js"></script>
</body>
</html>
